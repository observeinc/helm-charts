# Single-replica Deployment collector for cluster-level Kubernetes metrics and Prometheus metrics scraped from pods.
#
# GENERATED FILE, DO NOT EDIT. Run "make generate-examples" to regenerate it from the Observe
# Agent Helm chart (see scripts/README.md).
#
# Values for the opentelemetry-collector Helm chart 0.155.0, running otelcol-contrib 0.151.0, the
# collector version of the Observe Agent the values are generated from. Create the observe-collector
# Secret (see README.md), then:
#
#   helm install observe-cluster-metrics opentelemetry-collector --repo https://open-telemetry.github.io/opentelemetry-helm-charts \
#     --version 0.155.0 --namespace observe --values cluster-metrics-values.yaml
#
# The collector reads these variables from the observe-collector Secret:
#   DEPLOYMENT_ENVIRONMENT   Fallback deployment.environment.name for telemetry that does not set one
#   OBSERVE_CLUSTER_NAME     The cluster name, set as k8s.cluster.name
#   OBSERVE_CLUSTER_UID      The UID of the kube-system namespace: kubectl get namespace kube-system -o jsonpath='{.metadata.uid}'
#   OBSERVE_COLLECTION_URL   Your collection URL, e.g. https://123456789012.collect.observeinc.com
#   OBSERVE_TOKEN            An Observe ingest token
mode: deployment
replicaCount: 1
image:
  repository: otel/opentelemetry-collector-contrib
  tag: 0.151.0
command:
  extraArgs:
    - --feature-gates=+exporter.prometheusremotewritexporter.EnableMultipleWorkers
clusterRole:
  create: true
  rules:
    - apiGroups:
        - ""
        - '*'
        - apps
        - authorization.k8s.io
        - autoscaling
        - batch
        - networking.k8s.io
        - events.k8s.io
        - rbac.authorization.k8s.io
        - storage.k8s.io
        - vpcresources.k8s.aws
      resources:
        - '*'
      verbs:
        - get
        - list
        - watch
extraEnvsFrom:
  - secretRef:
      name: observe-collector
podAnnotations:
  observe_monitor_path: /metrics
  observe_monitor_port: "8888"
  observe_monitor_purpose: observecollection
  observe_monitor_scrape: "true"
  observeinc_com_scrape: "false"
affinity:
  nodeAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      nodeSelectorTerms:
        - matchExpressions:
            - key: observeinc.com/unschedulable
              operator: DoesNotExist
            - key: kubernetes.io/os
              operator: NotIn
              values:
                - windows
resources:
  limits:
    memory: 512Mi
  requests:
    cpu: 250m
    memory: 512Mi
ports:
  otlp:
    enabled: false
  otlp-http:
    enabled: false
  jaeger-compact:
    enabled: false
  jaeger-thrift:
    enabled: false
  jaeger-grpc:
    enabled: false
  zipkin:
    enabled: false
  metrics:
    enabled: false
service:
  enabled: false
alternateConfig:
  exporters:
    prometheusremotewrite/observe:
      endpoint: ${env:OBSERVE_COLLECTION_URL}/v1/prometheus
      headers:
        authorization: Bearer ${env:OBSERVE_TOKEN}
        x-observe-target-package: Kubernetes Explorer
      max_batch_request_parallelism: 5
      remote_write_queue:
        num_consumers: 5
      resource_to_telemetry_conversion:
        enabled: true
      retry_on_failure:
        enabled: true
        initial_interval: 1s
        max_elapsed_time: 5m
        max_interval: 30s
      send_metadata: true
      target_info:
        enabled: true
      timeout: 10s
  processors:
    attributes/debug_source_cadvisor_metrics:
      actions:
        - action: insert
          key: debug_source
          value: cadvisor_metrics
    attributes/debug_source_cluster_metrics:
      actions:
        - action: insert
          key: debug_source
          value: cluster_metrics
    attributes/debug_source_pod_metrics:
      actions:
        - action: insert
          key: debug_source
          value: pod_metrics
    batch:
      send_batch_max_size: 4096
      send_batch_size: 4096
      timeout: 5s
    k8sattributes:
      extract:
        labels:
          - from: pod
            key_regex: (app\.kubernetes\.io/.+)
            tag_name: $1
        metadata:
          - k8s.namespace.name
          - k8s.deployment.name
          - k8s.replicaset.name
          - k8s.statefulset.name
          - k8s.daemonset.name
          - k8s.cronjob.name
          - k8s.job.name
          - k8s.node.name
          - k8s.node.uid
          - k8s.pod.name
          - k8s.pod.uid
          - k8s.cluster.uid
          - k8s.container.name
          - service.namespace
          - service.name
          - service.version
          - service.instance.id
        otel_annotations: true
      passthrough: false
      pod_association:
        - sources:
            - from: resource_attribute
              name: k8s.pod.ip
        - sources:
            - from: resource_attribute
              name: k8s.pod.uid
        - sources:
            - from: connection
      wait_for_metadata: true
      wait_for_metadata_timeout: 10s
    memory_limiter:
      check_interval: 5s
      limit_percentage: 80
      spike_limit_percentage: 15
    resource/drop_container_info:
      attributes:
        - action: delete
          key: container.id
    resource/drop_service_name:
      attributes:
        - action: delete
          key: service.name
    resource/observe_common:
      attributes:
        - action: upsert
          key: k8s.cluster.name
          value: ${env:OBSERVE_CLUSTER_NAME}
        - action: upsert
          key: k8s.cluster.uid
          value: ${env:OBSERVE_CLUSTER_UID}
        - action: insert
          from_attribute: deployment.environment
          key: deployment.environment.name
        - action: insert
          from_attribute: deployment.environment.name
          key: deployment.environment
        - action: insert
          key: deployment.environment.name
          value: ${env:DEPLOYMENT_ENVIRONMENT}
        - action: insert
          key: deployment.environment
          value: ${env:DEPLOYMENT_ENVIRONMENT}
  receivers:
    k8s_cluster:
      allocatable_types_to_report:
        - cpu
        - memory
        - storage
        - ephemeral-storage
      auth_type: serviceAccount
      collection_interval: 60s
      metadata_collection_interval: 5m
      metrics:
        k8s.node.condition:
          enabled: true
      node_conditions_to_report:
        - Ready
        - MemoryPressure
        - DiskPressure
    prometheus/cadvisor:
      config:
        scrape_configs:
          - bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
            job_name: kubernetes-nodes-cadvisor
            kubernetes_sd_configs:
              - role: node
            relabel_configs:
              - replacement: kubernetes.default.svc:443
                target_label: __address__
              - regex: (.+)
                replacement: /api/v1/nodes/$$1/proxy/metrics/cadvisor
                source_labels:
                  - __meta_kubernetes_node_name
                target_label: __metrics_path__
            scheme: https
            tls_config:
              ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
              insecure_skip_verify: true
    prometheus/pod_metrics:
      config:
        scrape_configs:
          - honor_labels: true
            job_name: pod-metrics
            kubernetes_sd_configs:
              - role: pod
            metric_relabel_configs:
              - action: keep
                regex: (.*)
                source_labels:
                  - __name__
            relabel_configs:
              - action: keep
              - action: drop
                regex: (.*istio.*|.*ingress.*|kube-system)
                source_labels:
                  - __meta_kubernetes_namespace
              - action: keep
                regex: (.*)
                source_labels:
                  - __meta_kubernetes_namespace
              - action: keep
                regex: (.*metrics;|.*;\d+)
                source_labels:
                  - __meta_kubernetes_pod_container_port_name
                  - __meta_kubernetes_pod_annotation_prometheus_io_port
              - action: drop
                regex: Succeeded|Failed
                source_labels:
                  - __meta_kubernetes_pod_phase
              - action: drop
                regex: "false"
                source_labels:
                  - __meta_kubernetes_pod_annotation_observeinc_com_scrape
              - action: drop
                regex: "false"
                source_labels:
                  - __meta_kubernetes_pod_annotation_prometheus_io_scrape
              - action: replace
                regex: (https?)
                replacement: $1
                source_labels:
                  - __meta_kubernetes_pod_annotation_prometheus_io_scheme
                target_label: __scheme__
              - action: replace
                regex: (.+)
                replacement: $1
                source_labels:
                  - __meta_kubernetes_pod_annotation_prometheus_io_path
                target_label: __metrics_path__
              - action: replace
                regex: (.+?)(\:\d+)?;(\d+)
                replacement: $1:$3
                source_labels:
                  - __address__
                  - __meta_kubernetes_pod_annotation_prometheus_io_port
                target_label: __address__
              - action: replace
                regex: (.+)
                source_labels:
                  - __meta_kubernetes_pod_annotation_observeinc_com_path
                target_label: __metrics_path__
              - action: replace
                regex: ([^:]+)(?::\d+)?;(\d+)
                replacement: $1:$2
                source_labels:
                  - __address__
                  - __meta_kubernetes_pod_annotation_observeinc_com_port
                target_label: __address__
              - action: labelmap
                regex: __meta_kubernetes_pod_label_(.+)
              - action: replace
                source_labels:
                  - __meta_kubernetes_namespace
                target_label: kubernetes_namespace
              - action: replace
                source_labels:
                  - __meta_kubernetes_pod_name
                target_label: kubernetes_pod_name
            scrape_interval: 60s
            scrape_timeout: 10s
  service:
    pipelines:
      metrics:
        exporters:
          - prometheusremotewrite/observe
        processors:
          - memory_limiter
          - k8sattributes
          - batch
          - resource/observe_common
          - resource/drop_container_info
          - attributes/debug_source_cluster_metrics
        receivers:
          - k8s_cluster
      metrics/cadvisor:
        exporters:
          - prometheusremotewrite/observe
        processors:
          - memory_limiter
          - k8sattributes
          - batch
          - resource/observe_common
          - attributes/debug_source_cadvisor_metrics
        receivers:
          - prometheus/cadvisor
      metrics/pod_metrics:
        exporters:
          - prometheusremotewrite/observe
        processors:
          - memory_limiter
          - resource/drop_service_name
          - k8sattributes
          - batch
          - resource/observe_common
          - attributes/debug_source_pod_metrics
        receivers:
          - prometheus/pod_metrics
    telemetry:
      logs:
        encoding: console
        level: WARN
      metrics:
        level: normal
        readers:
          - pull:
              exporter:
                prometheus:
                  host: ${env:MY_POD_IP}
                  port: 8888
    extensions:
      - health_check
      - cgroupruntime
  extensions:
    health_check:
      endpoint: ${env:MY_POD_IP}:13133
    cgroupruntime:
      gomaxprocs:
        enabled: true
