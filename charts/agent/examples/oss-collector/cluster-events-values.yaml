        - mode: watch
          name: serviceaccounts
        - interval: 15m
          mode: pull
          name: customresourcedefinitions
        - mode: watch
          name: customresourcedefinitions
  service:
    pipelines:
      logs/cluster:
        exporters:
          - otlphttp/observe/entity
        processors:
          - memory_limiter
          - batch
          - resource/observe_common
          - filter/cluster
          - transform/cluster
        receivers:
          - k8sobjects/cluster
      logs/objects:
        exporters:
          - otlphttp/observe/entity
        processors:
          - memory_limiter
          - batch
          - resource/observe_common
          - transform/unify
          - transform/redact_secrets
          - transform/object
        receivers:
          - k8sobjects/objects
    telemetry:
      logs:
        encoding: console
        level: WARN
      metrics:
        level: normal
        readers:
          - pull:
              exporter:
                prometheus:
                  host: ${env:MY_POD_IP}
                  port: 8888
                  with_resource_constant_labels:
                    included:
                      - observe.agent.instance.id
      resource:
        observe.agent.instance.id: ${env:OTEL_K8S_POD_NAME}
    extensions:
      - health_check
      - cgroupruntime
  extensions:
    health_check:
      endpoint: ${env:MY_POD_IP}:13133
    cgroupruntime:
      gomaxprocs:
        enabled: true
