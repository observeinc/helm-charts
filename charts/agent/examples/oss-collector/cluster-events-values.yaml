#
# Values for the opentelemetry-collector Helm chart 0.155.0, running otelcol-contrib 0.151.0, the
# collector version of the Observe Agent the values are generated from. Create the observe-collector
# Secret (see README.md), then:
#
#   helm install observe-cluster-events opentelemetry-collector --repo https://open-telemetry.github.io/opentelemetry-helm-charts \
#     --version 0.155.0 --namespace observe --values cluster-events-values.yaml
#
# The collector reads these variables from the observe-collector Secret:
#   DEPLOYMENT_ENVIRONMENT   Fallback deployment.environment.name for telemetry that does not set one
