            - set(attributes["observe_transform"]["facets"]["externalTrafficPolicy"], body["spec"]["externalTrafficPolicy"])
            - set(attributes["observe_transform"]["facets"]["ipFamilies"], "IPv4,IPv6") where Len(body["spec"]["ipFamilies"]) == 2
            - set(attributes["observe_transform"]["facets"]["ipFamilies"], body["spec"]["ipFamilies"][0]) where Len(body["spec"]["ipFamilies"]) == 1
        - conditions:
            - body["kind"] == "Ingress"
          context: log
          statements:
            - set(attributes["observe_transform"]["identifiers"]["ingressName"], body["metadata"]["name"])
            - set(attributes["observe_transform"]["identifiers"]["ingressUid"], body["metadata"]["uid"])
            - set(attributes["observe_transform"]["facets"]["class"], body["spec"]["ingressClassName"])
            - set(attributes["observe_transform"]["facets"]["class"], body["metadata"]["annotations"]["kubernetes.io/ingress.class"]) where attributes["observe_transform"]["facets"]["class"] == nil
        - conditions:
            - body["kind"] == "RoleBinding"
          context: log
          statements:
            - set(attributes["observe_transform"]["identifiers"]["roleBindingName"], body["metadata"]["name"])
            - set(attributes["observe_transform"]["identifiers"]["roleBindingUid"], body["metadata"]["uid"])
            - set(attributes["observe_transform"]["facets"]["subjects"], body["subjects"])
            - set(attributes["observe_transform"]["facets"]["role"], body["roleRef"]["name"])
        - conditions:
            - body["kind"] == "Role"
          context: log
          statements:
            - set(attributes["observe_transform"]["identifiers"]["roleName"], body["metadata"]["name"])
            - set(attributes["observe_transform"]["identifiers"]["roleUid"], body["metadata"]["uid"])
            - set(attributes["observe_transform"]["facets"]["rules"], body["rules"])
            - set(attributes["observe_transform"]["facets"]["role"], body["roleRef"]["name"])
        - conditions:
            - body["kind"] == "ClusterRoleBinding"
          context: log
          statements:
            - set(attributes["observe_transform"]["identifiers"]["clusterRoleBindingName"], body["metadata"]["name"])
            - set(attributes["observe_transform"]["identifiers"]["clusterRoleBindingUid"], body["metadata"]["uid"])
            - set(attributes["observe_transform"]["facets"]["subjects"], body["subjects"])
            - set(attributes["observe_transform"]["facets"]["role"], body["roleRef"]["name"])
        - conditions:
            - body["kind"] == "ServiceAccount"
          context: log
          statements:
            - set(attributes["observe_transform"]["identifiers"]["serviceAccountName"], body["metadata"]["name"])
            - set(attributes["observe_transform"]["identifiers"]["serviceAccountUid"], body["metadata"]["uid"])
            - set(attributes["observe_transform"]["facets"]["automountToken"], body["automountServiceAccountToken"])
    transform/unify:
      error_mode: ignore
      log_statements:
        - context: log
          statements:
            - set(attributes["observe_transform"]["control"]["isDelete"], true) where body["object"] != nil and body["type"] == "DELETED"
            - set(attributes["observe_transform"]["control"]["debug_source"], "watch") where body["object"] != nil and body["type"] != nil
            - set(attributes["observe_transform"]["control"]["debug_source"], "pull") where body["object"] == nil or body["type"] == nil
            - set(body, body["object"]) where body["object"] != nil and body["type"] != nil
    transform/redact_secrets:
      error_mode: propagate
      log_statements:
        - context: log
          statements:
            - replace_all_patterns(body["data"], "value", "(?s)^.*$", "UkVEQUNURUQ=") where body["kind"] == "Secret" and body["data"] != nil
            - replace_all_patterns(body["stringData"], "value", "(?s)^.*$", "REDACTED") where body["kind"] == "Secret" and body["stringData"] != nil
            - delete_key(body["metadata"]["annotations"], "kubectl.kubernetes.io/last-applied-configuration") where body["kind"] == "Secret" and body["metadata"]["annotations"] != nil
  receivers:
    k8sobjects/cluster:
      auth_type: serviceAccount
      objects:
        - interval: 20m
          mode: pull
          name: namespaces
    k8sobjects/objects:
      auth_type: serviceAccount
      objects:
        - interval: 15m
          mode: pull
          name: events
        - mode: watch
          name: events
        - interval: 15m
          mode: pull
          name: pods
        - mode: watch
          name: pods
        - interval: 15m
          mode: pull
          name: namespaces
        - mode: watch
          name: namespaces
        - interval: 15m
          mode: pull
          name: nodes
        - mode: watch
          name: nodes
        - interval: 15m
          mode: pull
          name: deployments
        - mode: watch
          name: deployments
        - interval: 15m
          mode: pull
          name: replicasets
        - mode: watch
          name: replicasets
        - interval: 15m
          mode: pull
          name: configmaps
        - mode: watch
          name: configmaps
        - interval: 15m
          mode: pull
          name: endpoints
        - mode: watch
          name: endpoints
        - interval: 15m
          mode: pull
          name: jobs
        - mode: watch
          name: jobs
        - interval: 15m
          mode: pull
          name: cronjobs
        - mode: watch
          name: cronjobs
        - interval: 15m
          mode: pull
          name: daemonsets
        - mode: watch
          name: daemonsets
        - interval: 15m
          mode: pull
          name: statefulsets
        - mode: watch
          name: statefulsets
        - interval: 15m
          mode: pull
          name: services
        - mode: watch
          name: services
        - interval: 15m
          mode: pull
          name: ingresses
        - mode: watch
          name: ingresses
        - interval: 15m
          mode: pull
          name: secrets
        - mode: watch
          name: secrets
        - interval: 15m
          mode: pull
          name: persistentvolumeclaims
        - mode: watch
          name: persistentvolumeclaims
        - interval: 15m
          mode: pull
          name: persistentvolumes
        - mode: watch
          name: persistentvolumes
        - interval: 15m
          mode: pull
          name: storageclasses
        - mode: watch
          name: storageclasses
        - interval: 15m
          mode: pull
          name: roles
        - mode: watch
          name: roles
        - interval: 15m
          mode: pull
          name: rolebindings
        - mode: watch
          name: rolebindings
        - interval: 15m
          mode: pull
          name: clusterroles
        - mode: watch
          name: clusterroles
        - interval: 15m
          mode: pull
          name: clusterrolebindings
        - mode: watch
          name: clusterrolebindings
        - interval: 15m
          mode: pull
