mode: deployment
replicaCount: 1
image:
  repository: otel/opentelemetry-collector-contrib
  tag: 0.151.0
clusterRole:
  create: true
  rules:
    - apiGroups:
        - ""
        - '*'
        - apps
        - authorization.k8s.io
        - autoscaling
        - batch
        - networking.k8s.io
        - events.k8s.io
        - rbac.authorization.k8s.io
        - storage.k8s.io
        - vpcresources.k8s.aws
      resources:
        - '*'
      verbs:
        - get
        - list
        - watch
extraEnvsFrom:
  - secretRef:
      name: observe-collector
podAnnotations:
  observe_monitor_path: /metrics
  observe_monitor_port: "8888"
  observe_monitor_purpose: observecollection
  observe_monitor_scrape: "true"
  observeinc_com_scrape: "false"
resources:
  limits:
    memory: 256Mi
  requests:
    cpu: 150m
    memory: 256Mi
ports:
  otlp:
    enabled: false
  otlp-http:
    enabled: false
  jaeger-compact:
    enabled: false
  jaeger-thrift:
    enabled: false
  jaeger-grpc:
    enabled: false
  zipkin:
    enabled: false
  metrics:
    enabled: false
service:
  enabled: false
alternateConfig:
  exporters:
    otlphttp/observe/entity:
      compression: zstd
      headers:
        authorization: Bearer ${env:OBSERVE_TOKEN}
        x-observe-target-package: Kubernetes Explorer
      logs_endpoint: ${env:OBSERVE_COLLECTION_URL}/v1/kubernetes/v1/entity
      retry_on_failure:
        enabled: true
        initial_interval: 1s
        max_elapsed_time: 5m
        max_interval: 30s
      sending_queue:
        enabled: true
      timeout: 10s
  processors:
    batch:
      send_batch_max_size: 1024
      send_batch_size: 1024
      timeout: 5s
    filter/cluster:
      error_mode: ignore
      logs:
        log_record:
          - body["metadata"]["name"] != "kube-system" and body["object"]["metadata"]["name"] != "kube-system"
    memory_limiter:
      check_interval: 5s
      limit_percentage: 80
      spike_limit_percentage: 15
    resource/observe_common:
      attributes:
        - action: upsert
          key: k8s.cluster.name
          value: ${env:OBSERVE_CLUSTER_NAME}
        - action: upsert
          key: k8s.cluster.uid
          value: ${env:OBSERVE_CLUSTER_UID}
        - action: insert
          from_attribute: deployment.environment
          key: deployment.environment.name
        - action: insert
          from_attribute: deployment.environment.name
          key: deployment.environment
        - action: insert
          key: deployment.environment.name
          value: ${env:DEPLOYMENT_ENVIRONMENT}
        - action: insert
          key: deployment.environment
          value: ${env:DEPLOYMENT_ENVIRONMENT}
