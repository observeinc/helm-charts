# Single-replica Deployment collector that scrapes the other collectors' internal metrics, for monitoring the collectors in Observe.
#
# GENERATED FILE, DO NOT EDIT. Run "make generate-examples" to regenerate it from the Observe
# Agent Helm chart (see scripts/README.md).
#
# Values for the opentelemetry-collector Helm chart 0.155.0, running otelcol-contrib 0.151.0, the
# collector version of the Observe Agent the values are generated from. Create the observe-collector
# Secret (see README.md), then:
#
#   helm install observe-monitor opentelemetry-collector --repo https://open-telemetry.github.io/opentelemetry-helm-charts \
#     --version 0.155.0 --namespace observe --values monitor-values.yaml
#
# The collector reads these variables from the observe-collector Secret:
#   DEPLOYMENT_ENVIRONMENT   Fallback deployment.environment.name for telemetry that does not set one
#   OBSERVE_CLUSTER_NAME     The cluster name, set as k8s.cluster.name
#   OBSERVE_CLUSTER_UID      The UID of the kube-system namespace: kubectl get namespace kube-system -o jsonpath='{.metadata.uid}'
#   OBSERVE_COLLECTION_URL   Your collection URL, e.g. https://123456789012.collect.observeinc.com
#   OBSERVE_TOKEN            An Observe ingest token
mode: deployment
replicaCount: 1
image:
  repository: otel/opentelemetry-collector-contrib
  tag: 0.151.0
command:
  extraArgs:
    - --feature-gates=+exporter.prometheusremotewritexporter.EnableMultipleWorkers
clusterRole:
  create: true
  rules:
    - apiGroups:
        - ""
        - '*'
        - apps
        - authorization.k8s.io
        - autoscaling
        - batch
        - networking.k8s.io
        - events.k8s.io
        - rbac.authorization.k8s.io
        - storage.k8s.io
        - vpcresources.k8s.aws
      resources:
        - '*'
      verbs:
        - get
        - list
        - watch
extraEnvsFrom:
  - secretRef:
      name: observe-collector
podAnnotations:
  observe_monitor_path: /metrics
  observe_monitor_port: "8888"
  observe_monitor_purpose: observecollection
  observe_monitor_scrape: "false"
  observeinc_com_scrape: "false"
resources:
  limits:
    memory: 256Mi
  requests:
    cpu: 150m
    memory: 256Mi
ports:
  otlp:
    enabled: false
  otlp-http:
    enabled: false
  jaeger-compact:
    enabled: false
  jaeger-thrift:
    enabled: false
  jaeger-grpc:
    enabled: false
  zipkin:
    enabled: false
  metrics:
    enabled: true
    servicePort: 8888
    containerPort: 8888
    protocol: TCP
service:
  enabled: true
alternateConfig:
  exporters:
    prometheusremotewrite/observe:
      endpoint: ${env:OBSERVE_COLLECTION_URL}/v1/prometheus
      headers:
        authorization: Bearer ${env:OBSERVE_TOKEN}
        x-observe-target-package: Kubernetes Explorer
      max_batch_request_parallelism: 5
      remote_write_queue:
        num_consumers: 5
      resource_to_telemetry_conversion:
        enabled: true
      retry_on_failure:
        enabled: true
        initial_interval: 1s
        max_elapsed_time: 5m
        max_interval: 30s
      send_metadata: true
      target_info:
        enabled: true
      timeout: 10s
  processors:
    attributes/debug_source_agent_monitor:
      actions:
        - action: insert
          key: debug_source
          value: agent_monitor
    batch:
      send_batch_max_size: 4096
      send_batch_size: 4096
      timeout: 5s
    k8sattributes:
      extract:
        labels:
          - from: pod
            key_regex: (app\.kubernetes\.io/.+)
            tag_name: $1
        metadata:
          - k8s.namespace.name
          - k8s.deployment.name
          - k8s.replicaset.name
          - k8s.statefulset.name
          - k8s.daemonset.name
          - k8s.cronjob.name
          - k8s.job.name
          - k8s.node.name
          - k8s.node.uid
          - k8s.pod.name
          - k8s.pod.uid
          - k8s.cluster.uid
          - k8s.container.name
          - container.id
          - service.namespace
          - service.name
          - service.version
          - service.instance.id
        otel_annotations: true
      passthrough: false
      pod_association:
        - sources:
            - from: resource_attribute
              name: k8s.pod.ip
        - sources:
            - from: resource_attribute
              name: k8s.pod.uid
        - sources:
            - from: connection
      wait_for_metadata: true
      wait_for_metadata_timeout: 10s
    memory_limiter:
      check_interval: 5s
      limit_percentage: 80
      spike_limit_percentage: 15
    resource/drop_service_name:
      attributes:
        - action: delete
          key: service.name
    resource/observe_common:
      attributes:
        - action: upsert
          key: k8s.cluster.name
          value: ${env:OBSERVE_CLUSTER_NAME}
        - action: upsert
          key: k8s.cluster.uid
          value: ${env:OBSERVE_CLUSTER_UID}
        - action: insert
          from_attribute: deployment.environment
          key: deployment.environment.name
        - action: insert
          from_attribute: deployment.environment.name
          key: deployment.environment
        - action: insert
          key: deployment.environment.name
          value: ${env:DEPLOYMENT_ENVIRONMENT}
        - action: insert
          key: deployment.environment
          value: ${env:DEPLOYMENT_ENVIRONMENT}
  receivers:
    prometheus/collector:
      config:
        scrape_configs:
          - job_name: opentelemetry-collector-self
            scrape_interval: 60s
            static_configs:
              - targets:
                  - ${env:MY_POD_IP}:8888
          - honor_labels: true
            job_name: opentelemetry-collector-other
            kubernetes_sd_configs:
              - role: pod
            relabel_configs:
              - action: keep
                regex: observecollection
                source_labels:
                  - __meta_kubernetes_pod_annotation_observe_monitor_purpose
              - action: keep
                regex: true
                source_labels:
                  - __meta_kubernetes_pod_annotation_observe_monitor_scrape
              - action: replace
                regex: (.+)
                source_labels:
                  - __meta_kubernetes_pod_annotation_observe_monitor_path
                target_label: __metrics_path__
              - action: replace
                regex: ([^:]+)(?::\d+)?;(\d+)
                replacement: $$1:$$2
                source_labels:
                  - __address__
                  - __meta_kubernetes_pod_annotation_observe_monitor_port
                target_label: __address__
              - action: labelmap
                regex: __meta_kubernetes_pod_label_(.+)
              - action: replace
                source_labels:
                  - __meta_kubernetes_namespace
                target_label: kubernetes_namespace
              - action: replace
                source_labels:
                  - __meta_kubernetes_pod_name
                target_label: kubernetes_pod_name
            scrape_interval: 60s
  service:
    pipelines:
      metrics:
        exporters:
          - prometheusremotewrite/observe
        processors:
          - memory_limiter
          - resource/drop_service_name
          - k8sattributes
          - batch
          - resource/observe_common
          - attributes/debug_source_agent_monitor
        receivers:
          - prometheus/collector
    telemetry:
      logs:
        encoding: console
        level: WARN
      metrics:
        level: normal
        readers:
          - pull:
              exporter:
                prometheus:
                  host: ${env:MY_POD_IP}
                  port: 8888
                  with_resource_constant_labels:
                    included:
                      - observe.agent.instance.id
      resource:
        observe.agent.instance.id: ${env:OTEL_K8S_POD_NAME}
    extensions:
      - health_check
      - cgroupruntime
  extensions:
    health_check:
      endpoint: ${env:MY_POD_IP}:13133
    cgroupruntime:
      gomaxprocs:
        enabled: true
