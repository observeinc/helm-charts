# Sets a cluster deployment environment that overrides the environment applications set, so all
# telemetry gets "production". Overriding is the default; it is set explicitly here for clarity.
# Application telemetry goes through the gateway here.
observe:
  token:
    create: true

cluster:
  deploymentEnvironment:
    name: production
    overrideApplication: true

application:
  REDMetrics:
    enabled: true

node:
  forwarder:
    enabled: true
    metrics:
      outputFormat: otel

gatewayDeployment:
  enabled: true
