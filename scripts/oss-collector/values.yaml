# Chart values that the OpenTelemetry Collector examples in examples/oss-collector are generated
# from (see README.md). The deployment environment is a ${env:...} reference, so the generated
# configurations read it from the collector's environment at startup.
observe:
  token:
    create: true

cluster:
  deploymentEnvironment:
    name: ${env:DEPLOYMENT_ENVIRONMENT}
    # Telemetry that sets its own environment keeps it; DEPLOYMENT_ENVIRONMENT is only a fallback.
    overrideApplication: false

application:
  REDMetrics:
    enabled: true

gatewayDeployment:
  enabled: false

node:
  forwarder:
    metrics:
      outputFormat: otel

agent:
  config:
    global:
      fleet:
        enabled: false
