
name: Release Charts

on:
  push:
    branches:
      - main

jobs:
  release:
    runs-on: ubuntu-latest
    if: "!startsWith(github.event.head_commit.message, 'chore')"
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"
      - name: Install Helm
        uses: azure/setup-helm@v5
        with:
          version: v3.6.3
      - name: Build deps
        run: |
          make build-deps
      - name: Run chart-releaser
        id: cr
        uses: helm/chart-releaser-action@v1.7.0
        with:
          charts_dir: charts
        env:
          CR_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
          CR_GENERATE_RELEASE_NOTES: true
          CR_SKIP_EXISTING: true

      - name: Check out observe-agent
        if: contains(format(',{0},', steps.cr.outputs.changed_charts), ',charts/agent,')
        uses: actions/checkout@v7
        with:
          repository: observeinc/observe-agent
          path: observe-agent
          fetch-depth: 0

      - uses: actions/setup-python@v7
        if: contains(format(',{0},', steps.cr.outputs.changed_charts), ',charts/agent,')
        with:
          python-version: '3.12'

      - name: Add Observe Agent and OpenTelemetry changes to the agent release notes
        if: contains(format(',{0},', steps.cr.outputs.changed_charts), ',charts/agent,')
        env:
          GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
        run: |
          git fetch --tags
          python3 scripts/agent_release_notes/agent_release_notes.py --agent-repo observe-agent --update-release
